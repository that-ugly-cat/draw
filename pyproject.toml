[project]
name = "draw"
version = "0.1.0"
description = "draw.io diagrams inside the borant perimeter: per-user workspace, per-diagram share links, protected concurrent editing"
requires-python = ">=3.11"
# Exact pins since 19 Sep 2026. They were floors until the move to the new VPS,
# which made the difference visible: rebuilding on another machine is not copying
# an image, it is re-resolving every floor against the index of that day. The
# versions below are the ones installed in the image built and verified there.
#
# Pinning also settles the pair below by construction rather than by discipline:
# fastapi and starlette can no longer drift apart between two builds.
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "markdown==3.10.3",
]

# Both floors are declared together, and they have to move together. Starlette
# 1.x dropped the legacy TemplateResponse signature *and* the `on_startup`
# argument FastAPI 0.115 still passes to Router, so the two halves of that pair
# are the combination that breaks: an old FastAPI with a new Starlette fails at
# import with a message about neither. Templates here already use the current
# `TemplateResponse(request, name, ctx)` form.

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"draw.server" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
