[project]
name = "draw"
version = "0.1.0"
description = "draw.io diagrams inside the borant perimeter: per-user workspace, per-diagram share links, protected concurrent editing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "starlette>=1.6",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "mcp>=2.0,<3",
  "markdown",
]

# Both floors are declared together, and they have to move together. Starlette
# 1.x dropped the legacy TemplateResponse signature *and* the `on_startup`
# argument FastAPI 0.115 still passes to Router, so the two halves of that pair
# are the combination that breaks: an old FastAPI with a new Starlette fails at
# import with a message about neither. Templates here already use the current
# `TemplateResponse(request, name, ctx)` form.

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"draw.server" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
